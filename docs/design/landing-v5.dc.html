<!-- Source: Claude Design project "Project Atlas — Landing Directions", revision 5 (2026-08-27).
     DELTA over revision 4: HISTORY (superseded / withdrawn requirements and intents).

     DATA: requirements and intents may carry `state: 'superseded' | 'withdrawn'` (absent = active).
       superseded → `supersededBy: <id of the replacement, same type>`
       withdrawn  → `note: <one line why>`
     Our schema equivalent: `lifecycle: { state: 'superseded' | 'withdrawn', supersededBy?, since, reason? }`.

     WHERE: only in the detail panel of a SYSTEM (atlas selection or focus view), after the
     "Why it is built this way" list. Non-active requirements/intents attached to that system are
     NOT in the main lists; they appear here.

     MARKUP (panel, after the intents list):
       <div style="border-top: 1px solid var(--color-divider); padding-top: 12px">
         <button class="btn btn-ghost" style="font-size: 12.5px; padding-inline: 4px">
           {{ open ? 'Hide history' : 'Show history (N)' }}
         </button>
         <!-- when open: -->
         <div style="display: flex; flex-direction: column; gap: 7px; margin-top: 10px">
           <div style="background: transparent; border: 1px dashed var(--color-neutral-400); border-radius: 18px; padding: 11px 14px; opacity: 0.75">
             <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px">
               <span class="tag" style="font-size: 10px; padding: 2px 10px; background: {{ superseded ? neutral-300 : accent-200 }}; color: {{ superseded ? neutral-800 : accent-800 }}">{{ 'Superseded' | 'Withdrawn' }}</span>
               <span style="font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-600)">{{ 'Requirement' | 'Intent' }}</span>
               <span style="margin-left: auto; font-size: 10.5px; color: var(--color-neutral-600)">{{ date }}</span>
             </div>
             <div style="font-size: 13px; line-height: 1.35; color: var(--color-neutral-800); text-decoration: line-through; text-decoration-color: var(--color-neutral-400)">{{ title | statement }}</div>
             <div style="font-size: 11.5px; line-height: 1.4; color: var(--color-neutral-700); margin-top: 5px">{{ 'Replaced by: <replacement title>' | note }}</div>
           </div>
         </div>
       </div>
     The section is omitted entirely when the system has no history. No global "show retired" toggle.
-->
